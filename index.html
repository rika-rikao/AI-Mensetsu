<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面接練習AI (アプローチ1: パイプライン型)</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --panel: #ffffff; --danger: #ef4444; }
    body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 800px; margin: auto; background: var(--panel); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    h1, h2, h3 { margin-top: 0; }
    .card { background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    input, select, textarea, button { font-size: 14px; padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; }
    input.error-border { border: 2px solid var(--danger) !important; background-color: #fef2f2; }
    button { background: var(--primary); color: white; border: none; cursor: pointer; transition: 0.2s; font-weight: bold; }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    .log-box { height: 280px; overflow-y: auto; background: #fff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
    .msg { margin-bottom: 10px; padding: 10px 14px; border-radius: 8px; line-height: 1.5; }
    .msg.user { background: #dbeafe; margin-left: 15%; text-align: left; }
    .msg.ai { background: #f8fafc; border: 1px solid #e2e8f0; margin-right: 15%; text-align: left; }
    .status { font-weight: bold; margin-bottom: 8px; color: #2563eb; }
    .badge { display: inline-block; padding: 2px 6px; font-size: 11px; border-radius: 4px; background: #e2e8f0; margin-bottom: 4px; font-weight: normal; }
    .saved-badge { font-size: 11px; color: #16a34a; background: #dcfce7; padding: 2px 6px; border-radius: 4px; margin-left: 8px; display: none; }

    /* エラーモーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 12px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
      text-align: center;
    }
    .modal-icon { font-size: 40px; margin-bottom: 8px; }
    .modal-title { font-size: 18px; font-weight: bold; color: #1e293b; margin-bottom: 8px; }
    .modal-msg { font-size: 14px; color: #475569; margin-bottom: 20px; line-height: 1.5; white-space: pre-wrap; }
    .modal-btn { background: var(--primary); padding: 10px 24px; font-size: 14px; width: 100%; border-radius: 6px; }
  </style>
</head>
<body>
<div class="container">
  <h1>AI面接練習アプリ (確実動作版)</h1>

  <!-- APIキー設定 -->
  <div class="card" id="apiKeyCard">
    <label for="apiKey"><strong>Gemini API Key:</strong> </label>
    <input type="password" id="apiKey" style="width: 320px;" placeholder="AIzaSy...">
    <span id="keySavedBadge" class="saved-badge">✓ 保存済み</span>
    <span id="apiKeyHint" style="font-size: 12px; color: var(--danger); display: none; margin-left: 8px;">※APIキーを入力してください</span>
  </div>

  <!-- ステップ1: 初期設定 -->
  <div id="step-setup" class="card">
    <h3>1. 面接の初期設定</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;">
      <div>
        <label>志望業界・区分:</label><br>
        <input type="text" id="setupIndustry" value="IT業界・Webエンジニア" style="width:100%;">
      </div>
      <div>
        <label>選考フェーズ:</label><br>
        <select id="setupPhase" style="width:100%;">
          <option value="一次面接（現場・スキル重視）">一次面接（現場・スキル重視）</option>
          <option value="二次面接（カルチャーマッチ）">二次面接（カルチャーマッチ）</option>
          <option value="最終面接（志望動機・役員）">最終面接（志望動機・役員）</option>
        </select>
      </div>
    </div>
    <button id="startBtn" onclick="startInterview()" style="padding: 10px 20px; font-size: 15px;">面接を開始する</button>
  </div>

  <!-- ステップ2: 面接メイン画面 -->
  <div id="step-interview" style="display:none;">
    <div class="card">
      <div class="status" id="statusText">面接準備中...</div>
      <div class="log-box" id="chatLog"></div>

      <!-- 入力 (テキスト & 音声) -->
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="textInput" placeholder="回答を入力するか、音声入力を使ってください" style="flex: 1;" onkeydown="if(event.key==='Enter') sendTextAnswer();">
        <button id="sendBtn" onclick="sendTextAnswer()">送信</button>
      </div>

      <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between;">
        <button id="recordBtn" onclick="toggleSpeech()">🎤 音声入力を開始</button>
        <button id="finishBtn" onclick="finishInterview()" style="background: #dc2626;">面接を終了して分析へ</button>
      </div>
    </div>
  </div>

  <!-- ステップ3: 分析画面 -->
  <div id="step-analysis" style="display:none;" class="card">
    <h3>3. 対話分析・ログ</h3>
    <button onclick="downloadLog()">📜 ログを保存 (JSON)</button>
    <button onclick="location.reload()" style="background: #64748b; margin-left: 8px;">最初に戻る</button>
    <hr style="margin: 16px 0; border: none; border-top: 1px solid #cbd5e1;">
    <div id="analysisResult" style="white-space: pre-wrap; line-height: 1.6;">分析中...</div>
  </div>
</div>

<!-- 独自エラーモーダル -->
<div id="errorModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title" id="modalTitle">エラー</div>
    <div class="modal-msg" id="modalMsg"></div>
    <button class="modal-btn" onclick="closeModal()">確認</button>
  </div>
</div>

<script>
let interviewLog = [];
let isListening = false;
let recognition = null;
let currentQuestionType = "自然";
let saveTimeout = null;

// ★ 追加: 面接開始時に真っ先にマイク許可だけを取得する関数
async function requestMicrophonePermission() {
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      // 許可ダイアログを出す
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      // 許可されたらすぐにストリームを閉じる（アクセス権限の確保のみが目的）
      stream.getTracks().forEach(track => track.stop());
    }
  } catch (err) {
    console.warn("マイクの事前許可が取得できませんでした:", err);
    // ここでエラーが出ても、画面は止めずにテキスト入力で続行できるようにする
  }
}

// 音声認識オブジェクトをグローバルで1回だけ初期化する関数
function initSpeechRecognition() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRec) {
    recognition = new SpeechRec();
    recognition.lang = "ja-JP";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function(e) {
      const transcript = e.results[0][0].transcript;
      appendLog("user", transcript);
      handleCandidateAnswer(transcript);
    };

    recognition.onerror = function(e) {
      stopListeningUI();
      // エラーの種類によって適切にハンドリング
      if (e.error === 'no-speech') {
        // 何も話さなかった場合は拒否ではないので無視（またはコンソール出力のみ）
        console.warn("音声が検出されませんでした");
      } else if (e.error === 'aborted') {
        // 手動で停止した場合は何もしない
      } else if (e.error === 'not-allowed') {
        showErrorModal("マイク許可エラー", "マイクへのアクセスが拒否されました。\n\n【原因】\n1. ローカルファイル(file://)やhttp環境で開いている。※PCブラウザの仕様上、マイクの使用には https:// 環境が必須です。\n2. ブラウザやOSの設定でマイクがブロックされている。\n\n設定等をご確認いただくか、テキスト入力をご利用ください。");
      } else {
        showErrorModal("マイク入力エラー", "音声認識でエラーが発生しました (" + e.error + ")。テキスト入力枠からキーボードで回答してください。");
      }
    };

    recognition.onend = function() {
      stopListeningUI();
    };
  }
}

// 画面読み込み時の処理
window.onload = function() {
  initSpeechRecognition(); // アプリ起動時に1回だけ音声認識をセットアップ

  const apiKeyEl = document.getElementById("apiKey");
  const savedBadge = document.getElementById("keySavedBadge");

  if (apiKeyEl) {
    // 1. ローカルストレージ（ブラウザのキャッシュ）からAPIキーを読み込み
    const savedKey = localStorage.getItem("gemini_api_key_cache");
    if (savedKey) {
      apiKeyEl.value = savedKey;
      if (savedBadge) savedBadge.style.display = "inline-block";
    }

    // 2. 入力があるたびに即座にローカルストレージへ保存する
    apiKeyEl.addEventListener("input", function() {
      this.classList.remove("error-border");
      const hint = document.getElementById("apiKeyHint");
      if (hint) hint.style.display = "none";
      
      const val = this.value.trim();
      if (val) {
        localStorage.setItem("gemini_api_key_cache", val); // キャッシュに保存
        if (savedBadge) {
          savedBadge.innerText = "✓ 保存済み";
          savedBadge.style.display = "inline-block";
        }
      } else {
        localStorage.removeItem("gemini_api_key_cache"); // 空なら削除
        if (savedBadge) savedBadge.style.display = "none";
      }
    });
  }
};

// 安全なモーダル表示関数
function showErrorModal(title, message) {
  const modal = document.getElementById("errorModal");
  if (modal) {
    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalMsg").innerText = message;
    modal.style.display = "flex";
  } else {
    alert("【" + title + "】\n" + message);
  }
}

function closeModal() {
  const modal = document.getElementById("errorModal");
  if (modal) modal.style.display = "none";
  
  const apiKeyInput = document.getElementById("apiKey");
  if (apiKeyInput && !apiKeyInput.value.trim()) {
    apiKeyInput.focus();
  }
}

function pickQuestionType() {
  const rand = Math.random() * 15;
  if (rand < 8) return "自然な流れの深掘り質問";
  if (rand < 12) return "別角度・価値観からの質問";
  if (rand < 14) return "時事問題・Webニュース絡みの質問";
  return "変化球（一見よくわからない質問）";
}

function appendLog(sender, text, type = null) {
  const logBox = document.getElementById("chatLog");
  if (!logBox) return;
  const msg = document.createElement("div");
  msg.className = "msg " + sender;
  if (type) msg.innerHTML += "<div class='badge'>" + type + "</div><br>";
  msg.innerText += text;
  logBox.appendChild(msg);
  logBox.scrollTop = logBox.scrollHeight;
  interviewLog.push({ sender: sender, text: text, type: type, timestamp: new Date().toISOString() });
}

function speakText(text, callback) {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) {
    if (callback) callback();
    return;
  }
  window.speechSynthesis.cancel();
  const uttr = new SpeechSynthesisUtterance(text);
  uttr.lang = "ja-JP";
  uttr.onend = function() { if (callback) callback(); };
  window.speechSynthesis.speak(uttr);
}

// Gemini API 呼び出し
async function callGeminiFlash(prompt, enableSearch) {
  const apiKeyInput = document.getElementById("apiKey");
  const apiKey = apiKeyInput ? apiKeyInput.value.trim() : "";
  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=" + apiKey;

  const body = {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.7 }
  };
  if (enableSearch) {
    body.tools = [{ googleSearch: {} }];
  }

  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const errData = await res.json().catch(function(){ return {}; });
    const errMsg = (errData.error && errData.error.message) ? errData.error.message : ("HTTP " + res.status + " エラー");
    throw new Error(errMsg);
  }

  const data = await res.json();
  return data.candidates[0].content.parts[0].text;
}

// 面接開始処理
async function startInterview() {
  try {
    const apiKeyInput = document.getElementById("apiKey");
    if (!apiKeyInput) {
      alert("エラー：APIキー入力欄が見つかりません。HTML全体を正しく上書きコピーしてください。");
      return;
    }

    const apiKey = apiKeyInput.value.trim();

    // APIキー未入力チェック
    if (!apiKey) {
      apiKeyInput.classList.add("error-border");
      const hint = document.getElementById("apiKeyHint");
      if (hint) hint.style.display = "inline";
      showErrorModal("APIキーが未入力です", "面接を開始するには Gemini API Key が必要です。上部の入力欄にキーを入力してから再度お試しください。");
      return;
    }

    // 念のため開始時にも確実に保存
    localStorage.setItem("gemini_api_key_cache", apiKey);

    const startBtn = document.getElementById("startBtn");
    if (startBtn) {
      startBtn.disabled = true;
      startBtn.innerText = "マイクを確認中..."; // マイク確認中であることを明示
    }

    // ★ ユーザーアクション（面接を開始するボタンクリック）を起点に、真っ先にマイク利用の確認を出す
    await requestMicrophonePermission();

    if (startBtn) {
      startBtn.innerText = "面接官を呼び出し中...";
    }

    const stepSetup = document.getElementById("step-setup");
    const stepInterview = document.getElementById("step-interview");
    const statusText = document.getElementById("statusText");

    if (stepSetup) stepSetup.style.display = "none";
    if (stepInterview) stepInterview.style.display = "block";
    if (statusText) statusText.innerText = "面接官が質問を準備しています...";

    // 未対応ブラウザの場合のUI処理
    if (!recognition) {
      const rBtn = document.getElementById("recordBtn");
      if (rBtn) {
        rBtn.disabled = true;
        rBtn.innerText = "🎤 音声非対応 (テキストをご利用ください)";
      }
    }

    const indInput = document.getElementById("setupIndustry");
    const phsInput = document.getElementById("setupPhase");
    const industry = indInput ? indInput.value : "不明な業界";
    const phase = phsInput ? phsInput.value : "不明なフェーズ";

    const initialPrompt = "あなたは採用面接官です。業界:" + industry + "、フェーズ:" + phase + "です。まずは面接開始の挨拶と、簡潔な自己紹介を求めてください。120字以内で簡潔に。";
    
    const firstQ = await callGeminiFlash(initialPrompt, false);
    appendLog("ai", firstQ, "自己紹介");
    speakText(firstQ);
    if (statusText) statusText.innerText = "回答を入力して「送信」を押すか、音声入力を開始してください";

  } catch (err) {
    console.error(err);
    const stepSetup = document.getElementById("step-setup");
    const stepInterview = document.getElementById("step-interview");
    const startBtn = document.getElementById("startBtn");
    
    if (stepSetup) stepSetup.style.display = "block";
    if (stepInterview) stepInterview.style.display = "none";
    if (startBtn) {
      startBtn.disabled = false;
      startBtn.innerText = "面接を開始する";
    }
    showErrorModal("API接続エラー", "APIリクエストに失敗しました（キーが間違っている可能性があります）。\n\n詳細: " + err.message);
  }
}

function sendTextAnswer() {
  const input = document.getElementById("textInput");
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  appendLog("user", text);
  input.value = "";
  handleCandidateAnswer(text);
}

async function handleCandidateAnswer(answerText) {
  setInputsDisabled(true);
  const statusText = document.getElementById("statusText");
  if (statusText) statusText.innerText = "面接官が考え中...";
  currentQuestionType = pickQuestionType();

  const isSearchNeeded = currentQuestionType.includes("時事問題");
  const phsInput = document.getElementById("setupPhase");
  const phase = phsInput ? phsInput.value : "";
  
  const prompt = "あなたはプロの面接官です。\n現在のフェーズ: " + phase + "\n応募者の最新の回答:「" + answerText + "」\n次の質問の指定区分: 【" + currentQuestionType + "】\n※指定区分のトーンに従い、面接官として自然かつ的確な次の質問を1つだけ、150文字以内で発話してください。";

  try {
    const nextQ = await callGeminiFlash(prompt, isSearchNeeded);
    appendLog("ai", nextQ, currentQuestionType);
    speakText(nextQ);
    if (statusText) statusText.innerText = "回答をお待ちしています";
  } catch (err) {
    console.error(err);
    showErrorModal("質問生成エラー", err.message);
    if (statusText) statusText.innerText = "エラーが発生しました";
  } finally {
    setInputsDisabled(false);
  }
}

function setInputsDisabled(disabled) {
  const input = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");
  const recBtn = document.getElementById("recordBtn");
  if (input) input.disabled = disabled;
  if (sendBtn) sendBtn.disabled = disabled;
  if (recognition && recBtn) recBtn.disabled = disabled;
}

// 最初のシンプルで確実な形（ボタン押下と同時の同期実行）
function toggleSpeech() {
  if (!recognition) {
    showErrorModal("非対応ブラウザ", "お使いのブラウザは音声認識に対応していません。テキスト入力をご利用ください。");
    return;
  }
  if (!isListening) {
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    try {
      // 事前に許可を取っているので、ここでは同期的にstart()を呼ぶだけで確実・安全に動作する
      recognition.start();
      isListening = true;
      const btn = document.getElementById("recordBtn");
      if (btn) {
        btn.innerText = "⏹ 発話を終了";
        btn.style.background = "#ef4444";
      }
    } catch (e) {
      console.error(e);
    }
  } else {
    recognition.stop();
    stopListeningUI();
  }
}

function stopListeningUI() {
  isListening = false;
  const btn = document.getElementById("recordBtn");
  if (btn) {
    btn.innerText = "🎤 音声入力を開始";
    btn.style.background = "";
  }
}

async function finishInterview() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (recognition) recognition.stop();

  const stepInterview = document.getElementById("step-interview");
  const stepAnalysis = document.getElementById("step-analysis");
  if (stepInterview) stepInterview.style.display = "none";
  if (stepAnalysis) stepAnalysis.style.display = "block";

  const prompt = "以下の面接ログを多角的に分析し、フィードバックを出力してください。\n【面接ログ】\n" + JSON.stringify(interviewLog, null, 2);

  try {
    const analysis = await callGeminiFlash(prompt, false);
    const resDiv = document.getElementById("analysisResult");
    if (resDiv) resDiv.innerText = analysis;
  } catch (err) {
    console.error(err);
    const resDiv = document.getElementById("analysisResult");
    if (resDiv) resDiv.innerText = "分析生成エラー: " + err.message;
  }
}

function downloadLog() {
  const blob = new Blob([JSON.stringify(interviewLog, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "interview_log_" + Date.now() + ".json";
  a.click();
}
</script>
</body>
</html>
